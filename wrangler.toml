name = "titunge"
main = ".open-next/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
usage_model = "unbound"

# esbuild's keep-names default injects a `__name` helper at module scope;
# next-themes' flash-prevention script gets extracted and evaluated in a
# separate runtime context (via Function.prototype.toString()) that never
# sees that helper, throwing "__name is not defined" on every page load.
# See https://opennext.js.org/cloudflare/howtos/keep_names -- requires
# Wrangler >= 4.13.0 (this project is on 4.118.0).
keep_names = false

# Product images. Reads are public via the bucket's custom domain
# (R2_PUBLIC_BASE_URL); writes/deletes are tenant-scoped in src/lib/r2.ts by the
# `{business_id}/` key prefix. Create with:
#   wrangler r2 bucket create titunge-product-images
[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "titunge-product-images"

[vars]
# Must match the public custom domain attached to the bucket above.
#
# IMPORTANT: the zone-level route `*.titunge.com/*` sends this hostname to this
# Worker, which would shadow R2. images.titunge.com needs its own, more specific
# route with NO Worker assigned so it falls through to the bucket. More specific
# routes win over wildcards.
R2_PUBLIC_BASE_URL = "https://images.titunge.com"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

# Deploys to a separate Worker (titunge-staging.<subdomain>.workers.dev) so
# cron/webhook/payment changes can be tested against a live-but-not-real
# Supabase project before touching production. Needs setup before it's
# usable: create a second Supabase project, run the same migrations against
# it, and set this environment's own secrets with
# `wrangler secret put <NAME> --env staging` (all the same names as
# production — CRON_SECRET, LENCO_API_SECRET_KEY, etc. — pointed at
# sandbox/staging values). LENCO_SANDBOX should stay "true" here always.
[env.staging]
name = "titunge-staging"

[[env.staging.r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "titunge-product-images-staging"

[env.staging.vars]
R2_PUBLIC_BASE_URL = "https://images-staging.titunge.com"
